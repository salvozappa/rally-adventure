<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scatter preview</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e4dc;
        --dim: #9a948a;
        --panel: rgba(14, 15, 18, 0.82);
        --line: rgba(255, 255, 255, 0.1);
        --accent: #8fd45a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--ink);
      }
      canvas { display: block; }

      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        width: 218px;
        max-height: calc(100vh - 20px);
        overflow-y: auto;
        padding: 10px 12px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        user-select: none;
      }
      #ui.hidden > *:not(#uihead) { display: none; }
      #uihead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      #uihead b { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      #uihead span { color: var(--dim); font-size: 10px; cursor: pointer; }
      h4 {
        margin: 12px 0 5px;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        border-bottom: 1px solid var(--line);
        padding-bottom: 3px;
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 2px 0;
        cursor: pointer;
      }
      label.row input[type='checkbox'] { accent-color: var(--accent); margin: 0; }
      label.row span { flex: 1; }
      label.row kbd {
        color: var(--dim);
        font-size: 10px;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 3px;
      }
      label.row em { color: var(--dim); font-style: normal; font-size: 10px; }
      .btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
      button {
        flex: 1 1 auto;
        min-width: 44px;
        padding: 4px 6px;
        font: inherit;
        font-size: 10px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, 0.14); }
      button.on { background: var(--accent); color: #101a06; border-color: var(--accent); }

      #stats {
        position: fixed;
        top: 10px;
        right: 10px;
        padding: 8px 10px;
        min-width: 236px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        white-space: pre;
        font-size: 11px;
      }
      #stats b { color: var(--accent); }
      #hint {
        position: fixed;
        bottom: 8px;
        left: 10px;
        color: var(--dim);
        font-size: 10px;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #05060a;
        color: var(--dim);
        font-size: 13px;
        letter-spacing: 0.08em;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="boot">GENERATING WORLD…</div>
    <div id="ui">
      <div id="uihead"><b>Scatter</b><span id="uitoggle">[h] hide</span></div>
    </div>
    <div id="stats"></div>
    <div id="hint">
      WASD/QE fly &nbsp;|&nbsp; drag to look &nbsp;|&nbsp; shift boost &nbsp;|&nbsp; 1 driver's eye &nbsp;|&nbsp; 2 overhead &nbsp;|&nbsp; 3 orbit &nbsp;|&nbsp; 0-3 LOD lock &nbsp;|&nbsp; h hide UI
    </div>
    <script type="module" src="./scatter.preview.ts"></script>
  </body>
</html>
