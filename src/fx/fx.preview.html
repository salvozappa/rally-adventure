<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drive FX preview</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e4dc;
        --dim: #9a948a;
        --panel: rgba(14, 15, 18, 0.82);
        --line: rgba(255, 255, 255, 0.1);
        --accent: #ffb347;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: var(--ink);
      }
      canvas { display: block; }

      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        width: 224px;
        max-height: calc(100vh - 20px);
        overflow-y: auto;
        padding: 10px 12px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        user-select: none;
      }
      #uihead {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      #uihead b { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      #uihead span { color: var(--dim); font-size: 10px; }
      h4 {
        margin: 12px 0 5px;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--accent);
        border-bottom: 1px solid var(--line);
        padding-bottom: 3px;
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 2px 0;
        cursor: pointer;
      }
      label.row input[type='checkbox'] { accent-color: var(--accent); margin: 0; }
      label.row span { flex: 1; }
      .slider { padding: 3px 0; }
      .slider div { display: flex; justify-content: space-between; color: var(--dim); }
      .slider input { width: 100%; accent-color: var(--accent); margin: 1px 0 0; }
      .btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      button {
        flex: 1 1 auto;
        min-width: 44px;
        padding: 4px 6px;
        font: inherit;
        font-size: 10px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: rgba(255, 255, 255, 0.14); }
      button.on { background: var(--accent); color: #1a1200; border-color: var(--accent); }

      #stats {
        position: fixed;
        top: 10px;
        right: 10px;
        padding: 8px 10px;
        min-width: 224px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        backdrop-filter: blur(8px);
        white-space: pre;
        font-size: 11px;
      }
      #stats b { color: var(--accent); }
      #banner {
        position: fixed;
        left: 50%;
        bottom: 34px;
        transform: translateX(-50%);
        padding: 5px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 11px;
      }
      #hint {
        position: fixed;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--dim);
        font-size: 10px;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="uihead"><b>Drive FX</b><span id="uitoggle">[h] hide</span></div>
    </div>
    <div id="stats"></div>
    <div id="banner"></div>
    <div id="hint">
      drag: orbit &nbsp;|&nbsp; wheel: zoom &nbsp;|&nbsp; space: pause &nbsp;|&nbsp; c: camera
      &nbsp;|&nbsp; n: next scenario &nbsp;|&nbsp; wasd: drive (manual)
    </div>
    <script type="module" src="./fx.preview.ts"></script>
  </body>
</html>
